name: 🎬 RahasyaFacts Daily Upload

on:
  schedule:
    # Upload 1: 2:00 PM IST = 8:30 AM UTC
    - cron: '30 8 * * *'
    # Upload 2: 8:00 PM IST = 2:30 PM UTC
    - cron: '30 14 * * *'
  workflow_dispatch: # Manual trigger anytime

jobs:
  upload_short:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # Increased to 60 min — enough for everything

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu

      - name: 📦 Install Python dependencies
        run: pip install -r requirements.txt

      - name: 🚀 Run RahasyaFacts Bot
        timeout-minutes: 55  # Bot itself gets 55 min
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
        run: python main.py

      - name: 📊 Upload output logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-${{ github.run_number }}
          path: output/
          retention-days: 7
